<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCB Design Build · Leads by city</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     A renovation company's lead schedule, not a SaaS dashboard.
     Laid out like a drawing schedule: hairline rules instead of
     cards, city names in a text serif, counts set large and right
     aligned so the eye runs down one column of figures.

     Channel colours are drawn from the trade — slate, forest,
     brass — so they sit together rather than competing the way
     signal red/amber/green would.
  ============================================================ */
  :root{
    --paper:#FAFAF8;
    --ink:#1B1E20;
    --ink-soft:#5A6166;
    --ink-faint:#949A9E;
    --rule:#E4E3DE;
    --rule-soft:#EFEEEA;

    --direct:#4A5A6B;
    --organic:#3F6B54;
    --paid:#B07526;
    --other:#9A9691;

    --serif:'Newsreader',Georgia,serif;
    --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  body{padding:28px 0 44px;}
  .sheet{max-width:760px;margin:0 auto;padding:0 26px;}

  /* ---------- masthead ---------- */
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px;}
  h1{font-family:var(--serif);font-size:31px;font-weight:400;letter-spacing:-.015em;margin:0 0 3px;line-height:1.1;}
  .period-label{font-size:13px;color:var(--ink-soft);margin:0;}
  .feed{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-faint);white-space:nowrap;}
  .feed::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-faint);flex:none;}
  .feed.live::before{background:var(--organic);}
  .feed.stale::before{background:var(--paid);}
  .feed.busy::before{background:var(--ink-faint);animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.25;}}

  /* ---------- controls: quiet text, underline for state ---------- */
  .controls{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;
    padding-bottom:13px;border-bottom:1px solid var(--rule);}
  .switch{display:flex;gap:15px;flex-wrap:wrap;align-items:baseline;}
  .switch button{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--ink-faint);
    background:none;border:none;padding:2px 0;cursor:pointer;line-height:1.4;
    border-bottom:1.5px solid transparent;transition:color .12s ease;}
  .switch button:hover:not(:disabled){color:var(--ink);}
  .switch button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink);}
  .switch button:disabled{color:#C4C7C4;cursor:not-allowed;}
  .switch .sep{width:1px;align-self:stretch;background:var(--rule);}

  /* ---------- date range ---------- */
  .range{display:none;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:15px 0 0;}
  .range.open{display:flex;}
  .range label{display:block;font-size:11.5px;color:var(--ink-faint);margin-bottom:4px;}
  .range input{font-family:var(--sans);font-size:13px;color:var(--ink);padding:6px 8px;
    background:#fff;border:1px solid var(--rule);border-radius:3px;}
  .range button{font-family:var(--sans);font-size:13px;color:var(--paper);background:var(--ink);
    border:none;border-radius:3px;padding:7px 14px;cursor:pointer;}
  .range button:hover{background:#33383B;}
  .range .msg{font-size:12px;color:var(--ink-faint);flex:1 1 190px;line-height:1.5;}
  .range .msg.bad{color:#A8452C;}

  /* ---------- note ---------- */
  .note{display:none;margin:16px 0 0;font-size:12.5px;line-height:1.65;color:var(--ink-soft);
    padding-left:13px;border-left:2px solid var(--paid);}
  .note.show{display:block;}

  /* ---------- the schedule ---------- */
  .schedule{margin:6px 0 0;}
  .entry{padding:24px 0 20px;border-bottom:1px solid var(--rule);}
  .entry:first-child{padding-top:22px;}
  .entry-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;}
  .place{font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:-.01em;line-height:1.2;}
  .count{font-family:var(--serif);font-size:38px;font-weight:400;line-height:1;
    font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em;}
  .count.none{color:#C6C8C4;}

  .measure{display:flex;gap:2px;height:5px;margin:15px 0 12px;}
  .measure span{display:block;border-radius:1px;}
  .measure.empty{background:var(--rule-soft);border-radius:1px;}

  .split{display:flex;gap:26px;flex-wrap:wrap;}
  .part{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--ink-soft);}
  .part i{width:7px;height:7px;border-radius:1px;flex:none;align-self:center;}
  .part b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;}
  .part.nil{color:var(--ink-faint);}
  .part.nil b{color:var(--ink-faint);font-weight:400;}
  .part.nil i{opacity:.35;}

  /* ---------- summary ---------- */
  .summary{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    flex-wrap:wrap;padding:20px 0 0;font-size:13px;color:var(--ink-soft);}
  .summary .lead-total{font-family:var(--serif);font-size:16px;color:var(--ink);}
  .summary .elsewhere{color:var(--ink-faint);cursor:help;border-bottom:1px dotted var(--rule);}

  /* ---------- footnote ---------- */
  .foot{margin-top:26px;font-size:12px;line-height:1.7;color:var(--ink-faint);}
  .foot summary{cursor:pointer;color:var(--ink-soft);list-style:none;display:inline-block;
    border-bottom:1px solid var(--rule);padding-bottom:1px;}
  .foot summary::-webkit-details-marker{display:none;}
  .foot p{margin:11px 0 0;max-width:66ch;}

  .waiting{padding:60px 0;text-align:center;color:var(--ink-faint);font-size:13px;}

  :focus-visible{outline:2px solid var(--direct);outline-offset:3px;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
  @media (max-width:560px){
    h1{font-size:26px;}
    .place{font-size:21px;}
    .count{font-size:31px;}
    .split{gap:18px;}
    .controls{gap:14px;}
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="masthead">
    <div>
      <h1>Leads by city</h1>
      <p class="period-label" id="periodLabel">Loading</p>
    </div>
    <span class="feed" id="feed">Connecting</span>
  </div>

  <div class="controls">
    <div class="switch" id="periodSwitch">
      <button data-mode="month" data-value="0" type="button">This month</button>
      <button data-mode="month" data-value="1" type="button">Last month</button>
      <button data-mode="range" data-value="6" type="button">Six months</button>
      <button data-mode="custom" id="customBtn" type="button">Pick dates</button>
    </div>
    <div class="sep" aria-hidden="true"></div>
    <div class="switch" id="sourceSwitch" role="group" aria-label="Where the traffic source comes from">
      <button data-attr="crm" id="crmBtn" type="button">GoHighLevel</button>
      <button data-attr="session" type="button">This visit</button>
      <button data-attr="firstUser" type="button">First visit</button>
    </div>
  </div>

  <div class="range" id="range">
    <div>
      <label for="from">From</label>
      <input type="date" id="from">
    </div>
    <div>
      <label for="to">To</label>
      <input type="date" id="to">
    </div>
    <button id="apply" type="button">Show these dates</button>
    <p class="msg" id="rangeMsg" role="status" aria-live="polite"></p>
  </div>

  <p class="note" id="note"></p>

  <div class="schedule" id="schedule">
    <div class="waiting">Loading leads</div>
  </div>

  <div class="summary" id="summary"></div>

  <details class="foot">
    <summary>Where these numbers come from</summary>
    <p id="footText"></p>
    <p>Paid means the visit arrived from an ad. Organic means it came from an unpaid search or social result. Direct means there was no referrer at all — a typed address, a bookmark, or a link that carried no tracking.</p>
    <p id="footAlberta"></p>
  </details>
</div>

<script>
/* =========================================================
   CONFIG
========================================================= */
const LIVE_DATA_URL = "https://script.google.com/macros/s/AKfycbwMw3AH2gtuOkya2wlQ4QSZDXPlNY1aUYwyHYVsi9YUukpFESgnVvLRStWdj-yyXQD8/exec";

// The three places worth watching. Anything else that turns up is
// summed into a single quiet line under the totals rather than given a
// row of its own — the sheet always reads as these three entries, but
// the figures still add up to every lead that came in.
const FEATURED_CITIES = ['Red Deer', 'Cochrane', 'Calgary'];

// Must match the Apps Script constant and GA4's reporting timezone.
const REPORTING_TIMEZONE = 'America/Edmonton';
const DATA_RETENTION_MONTHS = 14;

const CHANNELS = [
  { key: 'direct',  label: 'Direct',  color: 'var(--direct)'  },
  { key: 'organic', label: 'Organic', color: 'var(--organic)' },
  { key: 'paid',    label: 'Paid',    color: 'var(--paid)'    }
];
// Referral, email and anything else. Shown only when it isn't zero, so
// the usual reading stays down to three figures.
const OTHER = { key: 'other', label: 'Other', color: 'var(--other)' };

const fmt = n => Number(n || 0).toLocaleString();
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const emptySplit = () => ({ direct: 0, organic: 0, paid: 0, other: 0 });

const state = { attr: 'crm', attrChosen: false, payload: null };

/* =========================================================
   NORMALISE
========================================================= */
function normalize(raw){
  const p = JSON.parse(JSON.stringify(raw || {}));
  p.totals = p.totals || {};
  ['session','firstUser','crm'].forEach(s => {
    const t = p.totals[s] = Object.assign(emptySplit(), p.totals[s] || {});
    Object.keys(t).forEach(k => { t[k] = Number(t[k] || 0); });
  });
  p.totals.all = Number(p.totals.all || 0);
  p.crmTotalLeads = Number(p.crmTotalLeads || 0);
  p.crmAvailable = !!p.crmAvailable;
  p.unattributedBucket = p.unattributedBucket || 'other';
  p.totals.assumed = Object.assign({ session:0, firstUser:0, crm:0 }, p.totals.assumed || {});

  p.cities = (p.cities || []).map(c => {
    ['session','firstUser','crm'].forEach(s => {
      c[s] = Object.assign(emptySplit(), c[s] || {});
      Object.keys(c[s]).forEach(k => { c[s][k] = Number(c[s][k] || 0); });
    });
    c.total = Number(c.total || 0);
    c.crmTotal = Number(c.crmTotal || 0);
    return c;
  });
  p.channels = p.channels || {};
  ['session','firstUser','crm'].forEach(s => { p.channels[s] = p.channels[s] || []; });
  return p;
}

// Under GoHighLevel the unit is a submission; under the GA4 views it's
// a generate_lead event. Never mix the two in one denominator.
const cityCount = c => state.attr === 'crm' ? c.crmTotal : c.total;
const grandTotal = () => state.attr === 'crm'
  ? (state.payload.crmTotalLeads || 0)
  : (state.payload.totals.all || 0);

/* =========================================================
   THREE ROWS, ALWAYS — plus whatever fell outside them
========================================================= */
function buildView(){
  const cities = state.payload.cities || [];
  const claimed = {};
  const rows = FEATURED_CITIES.map(name => {
    const match = cities.filter(c => c.city.toLowerCase() === name.toLowerCase())[0];
    if (match) claimed[match.city] = true;
    return {
      label: name,
      split: match ? match[state.attr] : emptySplit(),
      total: match ? cityCount(match) : 0
    };
  });

  // Not shown as a row, but never silently dropped: without this the
  // three figures wouldn't add up to the total and the sheet would be
  // quietly wrong.
  const remainder = { total: 0, towns: [], noCity: 0 };
  cities.forEach(c => {
    if (claimed[c.city]) return;
    const n = cityCount(c);
    if (!n) return;
    remainder.total += n;
    if (c.city === '(not set)') remainder.noCity += n;
    else remainder.towns.push({ name: c.city, n: n });
  });
  remainder.towns.sort((a, b) => b.n - a.n);

  return { rows: rows, remainder: remainder };
}

/* =========================================================
   RENDER
========================================================= */
function renderSchedule(view){
  const rows = view.rows;
  const anyOther = rows.some(r => r.split.other > 0);
  const channels = anyOther ? CHANNELS.concat([OTHER]) : CHANNELS;

  document.getElementById('schedule').innerHTML = rows.map(r => {
    const bar = r.total
      ? '<div class="measure">' + channels.map(ch => r.split[ch.key]
          ? `<span style="width:${(r.split[ch.key] / r.total) * 100}%;background:${ch.color}"></span>` : '').join('') + '</div>'
      : '<div class="measure empty"></div>';

    const split = channels.map(ch => {
      const n = r.split[ch.key] || 0;
      return `<span class="part${n ? '' : ' nil'}"><i style="background:${ch.color}"></i>${ch.label} <b>${fmt(n)}</b></span>`;
    }).join('');

    return `
      <div class="entry">
        <div class="entry-top">
          <div class="place">${esc(r.label)}</div>
          <div class="count${r.total ? '' : ' none'}">${fmt(r.total)}</div>
        </div>
        ${bar}
        <div class="split">${split}</div>
      </div>`;
  }).join('');
}

function renderSummary(view){
  const total = grandTotal();
  const t = state.payload.totals[state.attr];
  const noun = state.attr === 'crm' ? 'form submission' : 'lead';
  const counted = fmt(total) + ' ' + noun + (total === 1 ? '' : 's');
  const parts = CHANNELS.map(ch => ch.label.toLowerCase() + ' ' + fmt(t[ch.key])).join(', ');

  const r = view.remainder;
  let aside = '';
  if (r.total){
    const where = r.towns.map(x => x.name + ' ' + x.n);
    if (r.noCity) where.push(r.noCity + ' with no city given');
    aside = `<span class="elsewhere" title="${esc(where.join(', '))}">${fmt(r.total)} from elsewhere</span>`;
  }

  document.getElementById('summary').innerHTML =
    `<span class="lead-total">${counted}</span>${aside}<span>${parts}</span>`;
}

function renderNote(){
  const el = document.getElementById('note');
  const p = state.payload;

  if (state.attr === 'crm'){
    const gap = (p.crmTotalLeads || 0) - (p.totals.all || 0);
    if (gap > 0){
      el.innerHTML = `GoHighLevel recorded ${fmt(p.crmTotalLeads)} submissions here; GA4 logged ${fmt(p.totals.all)} lead events. ${fmt(gap)} never reached GA4.`;
      el.classList.add('show');
    } else if (gap < 0){
      el.innerHTML = `GA4 logged ${fmt(Math.abs(gap))} more lead events than GoHighLevel has submissions, which usually means the same submission was sent more than once.`;
      el.classList.add('show');
    } else {
      el.classList.remove('show');
    }
    return;
  }

  const unattributed = (p.channels[state.attr] || [])
    .filter(r => r.channel === 'Unassigned' || r.channel === '(not set)')
    .reduce((s, r) => s + r.leads, 0);

  if (!unattributed){ el.classList.remove('show'); return; }
  const bucket = p.unattributedBucket;
  const named = (CHANNELS.filter(c => c.key === bucket)[0] || { label: 'Other' }).label;
  el.innerHTML = bucket === 'other'
    ? `GA4 could not identify a source for ${fmt(unattributed)} of these ${fmt(p.totals.all)} leads. ${p.crmAvailable ? 'GoHighLevel knows where they came from.' : ''}`
    : `${fmt(unattributed)} of these ${fmt(p.totals.all)} leads are counted as ${named} by rule — GA4 had no source for them, so some may have been paid clicks. ${p.crmAvailable ? 'GoHighLevel has the real answer.' : ''}`;
  el.classList.add('show');
}

function renderFootnotes(){
  const p = state.payload;
  document.getElementById('footText').textContent = state.attr === 'crm'
    ? 'Counts come straight from GoHighLevel, which records the traffic source on each form submission at the moment it arrives. This is the most reliable of the three views.'
    : (state.attr === 'session'
        ? 'Counts come from GA4, using the channel of the visit the lead happened in. GA4 can only classify a visit it managed to link the lead to.'
        : 'Counts come from GA4, using how the browser was first acquired — which may have been months before this lead.');
  document.getElementById('footAlberta').textContent =
    'Only ' + FEATURED_CITIES.join(', ') + ' get their own line. Anything from another town, or a form sent without a city, is counted in the totals and noted as "from elsewhere" — hover it to see where.';
}

function renderAll(){
  updateSourceSwitch();
  const view = buildView();
  renderNote();
  renderSchedule(view);
  renderSummary(view);
  renderFootnotes();
}

function updateSourceSwitch(){
  const btn = document.getElementById('crmBtn');
  const ready = !!state.payload.crmAvailable;
  btn.disabled = !ready;
  btn.title = ready ? 'The source recorded on each submission in GoHighLevel'
                    : 'Connect the GoHighLevel API in the Apps Script to enable this';
  if (ready && !state.attrChosen) state.attr = 'crm';
  if (!ready && state.attr === 'crm') state.attr = 'session';
  document.querySelectorAll('#sourceSwitch button').forEach(b => {
    b.classList.toggle('on', b.dataset.attr === state.attr);
  });
}

document.querySelectorAll('#sourceSwitch button').forEach(b => {
  b.addEventListener('click', () => {
    if (b.disabled) return;
    state.attr = b.dataset.attr;
    state.attrChosen = true;
    renderAll();
  });
});

/* =========================================================
   FEED
========================================================= */
const cache = new Map();
const inFlight = new Map();
let seq = 0;

function setFeed(text, mode){
  const el = document.getElementById('feed');
  el.textContent = text;
  el.className = 'feed' + (mode ? ' ' + mode : '');
}
function markPeriod(mode, value){
  document.querySelectorAll('#periodSwitch button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === mode && (mode === 'custom' || Number(b.dataset.value) === value));
  });
}
function paramFor(mode, value){
  if (mode === 'custom'){
    const p = String(value).split('|');
    return 'start=' + encodeURIComponent(p[0]) + '&end=' + encodeURIComponent(p[1]);
  }
  return mode === 'range' ? 'rangeMonths=' + value : 'months=' + value;
}

function fetchPeriod(mode, value){
  const key = mode + ':' + value;
  if (inFlight.has(key)) return inFlight.get(key);
  const sep = LIVE_DATA_URL.indexOf('?') === -1 ? '?' : '&';
  const req = fetch(LIVE_DATA_URL + sep + paramFor(mode, value), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      if (!d || d.ok === false) throw new Error((d && d.error) || 'Bad response');
      cache.set(key, d);
      return d;
    })
    .finally(() => inFlight.delete(key));
  inFlight.set(key, req);
  return req;
}

async function load(mode, value, label){
  markPeriod(mode, value);
  const key = mode + ':' + value;
  const mine = ++seq;

  const show = data => {
    state.payload = normalize(data);
    document.getElementById('periodLabel').textContent = label || data.period || '';
    renderAll();
  };

  const cached = cache.get(key);
  if (cached){ setFeed('Live', 'live'); show(cached); return; }

  setFeed('Loading', 'busy');
  try {
    const data = await fetchPeriod(mode, value);
    if (mine !== seq) return;
    setFeed('Live', 'live');
    show(data);
  } catch (err){
    if (mine !== seq) return;
    console.warn('Feed unavailable:', err);
    setFeed('Not connected', 'stale');
    document.getElementById('periodLabel').textContent = 'Could not reach the data feed';
    document.getElementById('schedule').innerHTML =
      '<div class="waiting">The data feed did not respond. Reload to try again.</div>';
    document.getElementById('summary').innerHTML = '';
  }
}

document.querySelectorAll('#periodSwitch button').forEach(b => {
  if (b.dataset.mode === 'custom') return;
  b.addEventListener('click', () => {
    document.getElementById('range').classList.remove('open');
    load(b.dataset.mode, Number(b.dataset.value));
  });
});

/* =========================================================
   DATE RANGE
========================================================= */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const from = document.getElementById('from');
const to = document.getElementById('to');
const rangeMsg = document.getElementById('rangeMsg');

function todayThere(){
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: REPORTING_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
}
function minusMonths(iso, n){
  const p = iso.split('-').map(Number);
  let y = p[0], m = p[1] - n;
  while (m <= 0){ m += 12; y -= 1; }
  const last = new Date(y, m, 0).getDate();
  return y + '-' + String(m).padStart(2, '0') + '-' + String(Math.min(p[2], last)).padStart(2, '0');
}
function pretty(iso){
  const p = iso.split('-').map(Number);
  return p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + p[0];
}
function prettySpan(a, b){ return a === b ? pretty(a) : pretty(a) + ' to ' + pretty(b); }

function checkRange(a, b){
  const today = todayThere();
  if (!a || !b) return { bad: true, text: 'Choose a start and an end date.' };
  if (a > b) return { bad: true, text: 'The start date is after the end date.' };
  if (b > today) return { bad: true, text: 'There is no data past ' + pretty(today) + ' yet.' };
  if (a < minusMonths(today, DATA_RETENTION_MONTHS)) {
    return { text: 'GA4 only keeps city detail for ' + DATA_RETENTION_MONTHS + ' months, so older leads may arrive without one.' };
  }
  if (b === today) return { text: 'Today is included and still settling, so the last day or two may rise.' };
  return null;
}
function setMsg(v){
  rangeMsg.textContent = v ? v.text : '';
  rangeMsg.classList.toggle('bad', !!(v && v.bad));
}

function applyRange(){
  const v = checkRange(from.value, to.value);
  if (v && v.bad){ setMsg(v); return; }
  setMsg(v);
  load('custom', from.value + '|' + to.value, prettySpan(from.value, to.value));
}

document.getElementById('customBtn').addEventListener('click', () => {
  const el = document.getElementById('range');
  const open = !el.classList.contains('open');
  el.classList.toggle('open', open);
  if (open) from.focus();
});
[from, to].forEach(i => {
  i.addEventListener('change', () => { if (from.value && to.value) setMsg(checkRange(from.value, to.value)); });
  i.addEventListener('keydown', e => { if (e.key === 'Enter') applyRange(); });
});
document.getElementById('apply').addEventListener('click', applyRange);

(function seed(){
  const t = todayThere();
  from.max = t; to.max = t;
