<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversions</title>
<style>
  /* ============================================================
     Styled to sit alongside Agency Analytics' own report widgets:
     white cards on a light grey canvas, a hairline border, a small
     mark + label top-left, a grey badge top-right, and the figure
     set large and centred in mid-grey. One "headline" card gets a
     soft tint to match the way AA highlights its primary metric.
  ============================================================ */
  :root{
    --canvas:#F4F5F7;
    --panel:#FFFFFF;
    --line:#E3E5E9;
    --line-soft:#EDEFF2;
    --figure:#4A4A4A;
    --label:#6C7684;
    --muted:#98A0AB;
    --link:#2F7DD1;
    --shadow:0 1px 2px rgba(16,24,40,.04);

    --direct:#4E7BB5;
    --organic:#4B9E6B;
    --paid:#E08B3C;
    --other:#A2A9B4;
    --headline-bg:#E9F7EE;
    --headline-line:#CFEBD9;

    --font:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--canvas);font-family:var(--font);color:var(--figure);
    -webkit-font-smoothing:antialiased;}
  body{padding:14px 0 30px;}
  body.embed{padding:10px 0;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 14px;}
  body.embed .wrap{padding:0 10px;}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px;}
  .tabs button{font-family:var(--font);font-size:13px;color:var(--label);background:none;border:none;
    padding:6px 14px;border-radius:3px;cursor:pointer;line-height:1.4;white-space:nowrap;}
  .tabs button:hover:not(.on){background:var(--canvas);color:var(--figure);}
  .tabs button.on{background:#EEF3F9;color:var(--link);font-weight:500;}

  .copylink{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:12.5px;
    color:var(--label);background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:7px 12px;cursor:pointer;white-space:nowrap;}
  .copylink:hover{color:var(--figure);border-color:#C9CED6;}
  .copylink svg{flex:none;}
  .copylink.done{color:#2F7350;border-color:#CFEBD9;background:#F1FBF4;}

  .periods{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px;}
  .periods button{font-family:var(--font);font-size:12.5px;color:var(--label);background:none;border:none;
    padding:6px 11px;border-radius:3px;cursor:pointer;white-space:nowrap;}
  .periods button:hover:not(.on){background:var(--canvas);color:var(--figure);}
  .periods button.on{background:#EEF3F9;color:var(--link);font-weight:500;}

  .status{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);}
  .status.live::before{background:#4B9E6B;}
  .status.bad::before{background:#D0743C;}

  /* ---------- date range ---------- */
  .daterange{display:none;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:12px;}
  .daterange.open{display:flex;}
  .daterange label{display:block;font-size:11.5px;color:var(--label);margin-bottom:4px;}
  .daterange input{font-family:var(--font);font-size:13px;color:var(--figure);padding:6px 8px;
    border:1px solid var(--line);border-radius:3px;background:#fff;}
  .daterange button{font-family:var(--font);font-size:13px;color:#fff;background:var(--link);border:none;
    border-radius:3px;padding:8px 15px;cursor:pointer;}
  .daterange button:hover{background:#2569B4;}
  .daterange .err{font-size:12px;color:#C0562C;align-self:center;}

  /* ---------- metric cards ---------- */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:11px 13px 20px;
    display:flex;flex-direction:column;min-height:132px;box-shadow:var(--shadow);}
  .metric.headline{background:var(--headline-bg);border-color:var(--headline-line);}
  .metric-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .metric-name{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--label);}
  .mark{flex:none;display:inline-flex;width:16px;height:16px;border-radius:4px;overflow:hidden;}
  .sq{width:9px;height:9px;border-radius:2px;flex:none;}
  .badge{font-size:11px;color:var(--label);background:#EDEFF2;border-radius:3px;padding:2px 7px;line-height:1.6;}
  .metric.headline .badge{background:#DBF0E2;}
  .metric-figure{flex:1;display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1;padding-top:8px;}
  .metric-figure.zero{color:#C9CDD3;}
  .metric-error{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;box-shadow:var(--shadow);}
  @media (max-width:860px){ .metrics{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:460px){ .metrics{grid-template-columns:1fr;} }

  /* ---------- panel ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:var(--shadow);}
  .panel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;border-bottom:1px solid var(--line);}
  .panel-top h2{font-size:13px;font-weight:500;color:var(--label);margin:0;}
  .panel-top .count{font-size:11.5px;color:var(--muted);}

  /* ---------- submissions accordion ---------- */
  .acc-item{border-bottom:1px solid var(--line-soft);}
  .acc-item:last-child{border-bottom:none;}
  .acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:none;border:none;text-align:left;font-family:var(--font);cursor:pointer;
    padding:13px 14px;color:inherit;}
  .acc-head:hover{background:#FAFBFC;}
  .acc-head-left{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 auto;}
  .acc-name{font-size:14px;font-weight:500;color:var(--figure);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .acc-service{font-size:12.5px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .acc-head-right{display:flex;align-items:center;gap:10px;flex:none;}
  .acc-date{font-size:12.5px;color:var(--label);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .chev{color:var(--muted);transition:transform .2s ease;flex:none;}
  .acc-item.open .chev{transform:rotate(180deg);}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .22s ease;}
  .acc-body-inner{padding:0 14px 16px 14px;}
  .rec-msg{font-size:13px;line-height:1.6;color:#5A6169;white-space:pre-wrap;word-break:break-word;max-width:74ch;}
  .rec-msg.empty{color:var(--muted);font-style:italic;}
  .rec-extra{font-size:11.5px;color:var(--muted);margin-top:8px;}
  .tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:3px;line-height:1.5;flex:none;}
  .tag.paid{background:#FBEEE1;color:#A2601F;}
  .tag.organic{background:#E6F4EC;color:#2F7350;}
  .tag.direct{background:#E9F0F8;color:#375F8C;}
  .tag.other{background:#EDEFF2;color:#6C7684;}
  @media (max-width:640px){
    .acc-head{flex-wrap:wrap;row-gap:6px;}
    .acc-head-right{width:100%;justify-content:space-between;}
  }

  .empty{padding:44px 16px;text-align:center;color:var(--muted);font-size:13px;}

  :focus-visible{outline:2px solid var(--link);outline-offset:2px;}
</style>
</head>
<body>
<!-- shared gradient used by the small card mark, defined once so every
     icon references the same id instead of minting its own defs block -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E7BB5"/>
      <stop offset="1" stop-color="#4B9E6B"/>
    </linearGradient>
  </defs>
</svg>

<div class="wrap">
  <div class="toolbar" id="toolbar">
    <div class="toolbar-left">
      <div class="tabs" id="tabs"></div>
      <button class="copylink" id="copyMetrics" type="button" title="Copy a link that embeds only the metric cards">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M8 12a4 4 0 0 0 5.66 0l2-2a4 4 0 1 0-5.66-5.66l-1 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 8a4 4 0 0 0-5.66 0l-2 2a4 4 0 1 0 5.66 5.66l1-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span id="copyMetricsLabel">Copy metrics link</span>
      </button>
      <button class="copylink" id="copySubmissions" type="button" title="Copy a link that embeds only the submissions list">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M8 12a4 4 0 0 0 5.66 0l2-2a4 4 0 1 0-5.66-5.66l-1 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 8a4 4 0 0 0-5.66 0l-2 2a4 4 0 1 0 5.66 5.66l1-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span id="copySubmissionsLabel">Copy submissions link</span>
      </button>
    </div>
    <div class="periods" id="periods">
      <button data-mode="month" data-value="1" type="button">Last month</button>
      <button data-mode="month" data-value="0" type="button">This month</button>
      <button data-mode="range" data-value="6" type="button">6 months</button>
      <button data-mode="custom" id="customBtn" type="button">Custom</button>
      <span class="status" id="status" style="padding:6px 10px;">Loading</span>
    </div>
  </div>

  <div class="daterange" id="daterange">
    <div><label for="from">From</label><input type="date" id="from"></div>
    <div><label for="to">To</label><input type="date" id="to"></div>
    <button id="apply" type="button">Apply</button>
    <span class="err" id="rangeErr"></span>
  </div>

  <div class="metrics" id="metrics"></div>
  <div id="body"></div>
</div>

<script>
/* =========================================================
   CONFIG
   ---------------------------------------------------------
   THREE THINGS CAN BE LOCKED VIA THE URL, INDEPENDENTLY:

   ?city=Red%20Deer     — restrict the data to one city.
                          (or hardcode FORCE_CITY below)
   ?view=metrics        — show ONLY the four metric cards.
                          No toolbar, no period switcher, no
                          submissions list. Nothing else loads.
   ?view=submissions    — show ONLY the submissions list (as a
                          click-to-expand accordion). No toolbar,
                          no metric cards.
   (no ?view=)          — the full hub: city tabs, period
                          switcher, both metric cards and the
                          submissions list, plus two "Copy link"
                          buttons that build the ?view= links
                          above for whichever tab is selected.

   So for one city there are three usable links: the plain
   ?city=X hub (for your own review, with a period switcher), and
   the two locked-down ?city=X&view=metrics / &view=submissions
   links, which are what you actually paste into an iframe.
========================================================= */
const LIVE_DATA_URL = "https://script.google.com/macros/s/AKfycbwMw3AH2gtuOkya2wlQ4QSZDXPlNY1aUYwyHYVsi9YUukpFESgnVvLRStWdj-yyXQD8/exec";
const ACCESS_KEY = "kcb-7f3a91c2";   // must match ACCESS_KEY in the Apps Script

const CITIES = ['Red Deer', 'Cochrane', 'Calgary'];
const FORCE_CITY = '';               // e.g. 'Red Deer' to pin this copy to one city

const REPORTING_TIMEZONE = 'America/Edmonton';
const DEFAULT_PERIOD = { mode: 'month', value: 1 };   // last month, by default

const CHANNELS = [
  { key: 'direct',  label: 'Direct',  color: 'var(--direct)'  },
  { key: 'organic', label: 'Organic', color: 'var(--organic)' },
  { key: 'paid',    label: 'Paid',    color: 'var(--paid)'    }
];
const OTHER = { key: 'other', label: 'Other', color: 'var(--other)' };
const ALL_CHANNELS = CHANNELS.concat([OTHER]);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const fmt = n => Number(n || 0).toLocaleString();
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const emptySplit = () => ({ direct: 0, organic: 0, paid: 0, other: 0 });

const MARK = '<span class="mark" aria-hidden="true"><svg viewBox="0 0 20 20" width="16" height="16">'
  + '<rect width="20" height="20" rx="5" fill="url(#markGrad)"/>'
  + '<path d="M5 13.5 8.5 8l3 3.5L15 6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
  + '</svg></span>';

const urlParams = new URLSearchParams(location.search);

function lockedCity(){
  const q = urlParams.get('city');
  const wanted = (q || FORCE_CITY || '').trim();
  if (!wanted) return null;
  const hit = CITIES.filter(c => c.toLowerCase() === wanted.toLowerCase())[0];
  return hit || null;
}

function currentView(){
  const v = (urlParams.get('view') || '').toLowerCase();
  return (v === 'metrics' || v === 'submissions') ? v : 'all';
}

const LOCKED = lockedCity();
const VIEW = currentView();
const state = { tab: LOCKED || 'All', payload: null };

// Apply the view lock to the DOM once, up front — nothing conditional
// left in the render functions themselves, so an embed never briefly
// flashes chrome it's about to hide.
if (VIEW !== 'all') {
  document.body.classList.add('embed');
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('daterange').style.display = 'none';
}
if (VIEW === 'metrics') {
  document.getElementById('body').style.display = 'none';
}
if (VIEW === 'submissions') {
  document.getElementById('metrics').style.display = 'none';
}

/* =========================================================
   DATA
   The feed is CRM conversions only — no analytics-session data,
   no vendor names. Every number here traces back to a real
   conversion your CRM recorded.
========================================================= */
function normalize(raw){
  const p = JSON.parse(JSON.stringify(raw || {}));
  p.connected = raw && raw.connected !== false;
  p.totals = Object.assign(emptySplit(), p.totals || {});
  p.totalConversions = Number(p.totalConversions || 0);
  p.submissions = p.submissions || [];
  return p;
}

function rowsFor(tab){
  const subs = state.payload.submissions || [];
  if (tab === 'All') return subs;
  return subs.filter(s => String(s.city).toLowerCase() === tab.toLowerCase());
}

function splitFor(tab){
  const split = emptySplit();
  rowsFor(tab).forEach(s => { split[s.bucket] = (split[s.bucket] || 0) + 1; });
  return split;
}

function totalFor(tab){
  return rowsFor(tab).length;
}

/* =========================================================
   RENDER
========================================================= */
function renderTabs(){
  const el = document.getElementById('tabs');
  if (LOCKED){ el.style.display = 'none'; return; }
  el.innerHTML = ['All'].concat(CITIES).map(t =>
    `<button type="button" data-tab="${esc(t)}" class="${t === state.tab ? 'on' : ''}">${esc(t)}</button>`
  ).join('');
}

function renderMetrics(){
  const total = totalFor(state.tab);
  const split = splitFor(state.tab);
  const anyOther = (split.other || 0) > 0;
  const channels = anyOther ? ALL_CHANNELS : CHANNELS;

  const cards = [{ label: 'Conversions', n: total, color: null, badge: '', headline: true }].concat(
    channels.map(ch => ({
      label: ch.label,
      n: split[ch.key] || 0,
      color: ch.color,
      badge: total ? Math.round(((split[ch.key] || 0) / total) * 100) + '%' : '0%',
      headline: false
    }))
  );

  document.getElementById('metrics').innerHTML = cards.map(c => `
    <div class="metric${c.headline ? ' headline' : ''}">
      <div class="metric-top">
        <span class="metric-name">${MARK}${c.color ? `<i class="sq" style="background:${c.color}"></i>` : ''}${esc(c.label)}</span>
        ${c.badge ? `<span class="badge">${c.badge}</span>` : ''}
      </div>
      <div class="metric-figure${c.n ? '' : ' zero'}">${fmt(c.n)}</div>
    </div>`).join('');
}

function longDate(iso){
  if (!iso) return '';
  const p = iso.split('-').map(Number);
  return p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + p[0];
}

function renderSubmissions(){
  const rows = rowsFor(state.tab);
  const list = rows.length
    ? '<div>' + rows.map((r, i) => {
        const extras = [];
        if (r.campaign && r.campaign !== '(not set)') extras.push(r.campaign);
        if (r.ad) extras.push('ad click');
        if (r.form && r.form !== '(unknown form)') extras.push(r.form);
        if (state.tab === 'All' && r.city) extras.unshift(r.city);
        const hasMessage = !!(r.message && r.message.trim());
        return `
          <div class="acc-item" data-i="${i}">
            <button class="acc-head" type="button" aria-expanded="false">
              <span class="acc-head-left">
                <span class="acc-name">${esc(r.name || 'Enquiry')}</span>
                ${r.service ? `<span class="acc-service">${esc(r.service)}</span>` : ''}
              </span>
              <span class="acc-head-right">
                <span class="tag ${esc(r.bucket)}">${esc(r.source)}</span>
                <span class="acc-date">${esc(longDate(r.date))}, ${esc(r.time)}</span>
                <svg class="chev" width="12" height="12" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M5 7.5 10 12.5 15 7.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
                <div class="rec-msg${hasMessage ? '' : ' empty'}">${hasMessage ? esc(r.message) : 'No message included with this submission.'}</div>
                ${extras.length ? `<div class="rec-extra">${esc(extras.join(' · '))}</div>` : ''}
              </div>
            </div>
          </div>`;
      }).join('') + '</div>'
    : '<div class="empty">No conversions in this period.</div>';

  document.getElementById('body').innerHTML = `
    <div class="panel">
      <div class="panel-top">
        <h2>${state.tab === 'All' ? 'Conversions' : esc(state.tab) + ' conversions'}</h2>
        <span class="count">${fmt(rows.length)}</span>
      </div>
      ${list}
    </div>`;

  document.querySelectorAll('.acc-head').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.closest('.acc-item');
      const bodyEl = item.querySelector('.acc-body');
      const isOpen = item.classList.contains('open');
      if (isOpen) {
        bodyEl.style.maxHeight = '0px';
        item.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      } else {
        bodyEl.style.maxHeight = bodyEl.scrollHeight + 'px';
        item.classList.add('open');
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  });
}

function showFeedError(message){
  if (VIEW !== 'submissions') {
    document.getElementById('metrics').innerHTML = '<div class="metric-error">' + esc(message) + '</div>';
  }
  if (VIEW !== 'metrics') {
    document.getElementById('body').innerHTML = '<div class="panel"><div class="empty">' + esc(message) + '</div></div>';
  }
}

function renderAll(){
  if (VIEW === 'all') { renderTabs(); updateCopyLinks(); }
  if (VIEW !== 'submissions') renderMetrics();
  if (VIEW !== 'metrics') renderSubmissions();
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab;
  renderAll();
});

/* =========================================================
   COPY-LINK — builds the two ?view= embed links (metrics /
   submissions) for whichever tab is currently selected, and puts
   whichever one is clicked onto the clipboard. Paste the result
   straight into an iframe src.
========================================================= */
function linkFor(view, tab){
  const url = new URL(location.href);
  url.search = '';
  if (tab !== 'All') url.searchParams.set('city', tab);
  url.searchParams.set('view', view);
  return url.toString();
}

function updateCopyLinks(){
  const suffix = state.tab === 'All' ? '' : ' (' + state.tab + ')';
  document.getElementById('copyMetricsLabel').textContent = 'Copy metrics link' + suffix;
  document.getElementById('copySubmissionsLabel').textContent = 'Copy submissions link' + suffix;
}

async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch (err2) {
      return false;
    }
  }
}

function wireCopyButton(btnId, labelId, view){
  const btn = document.getElementById(btnId);
  const label = document.getElementById(labelId);
  btn.addEventListener('click', async () => {
    const ok = await copyText(linkFor(view, state.tab));
    const original = label.textContent;
    label.textContent = ok ? 'Copied!' : 'Could not copy';
    btn.classList.toggle('done', ok);
    setTimeout(() => { label.textContent = original; btn.classList.remove('done'); }, 1600);
  });
}
wireCopyButton('copyMetrics', 'copyMetricsLabel', 'metrics');
wireCopyButton('copySubmissions', 'copySubmissionsLabel', 'submissions');

/* =========================================================
   FEED
========================================================= */
const cache = new Map();
let seq = 0;

function setStatus(text, cls){
  const el = document.getElementById('status');
  if (!el) return;
  el.textContent = text;
  el.className = 'status' + (cls ? ' ' + cls : '');
}
function markPeriod(mode, value){
  document.querySelectorAll('#periods button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === mode && (mode === 'custom' || Number(b.dataset.value) === value));
  });
}
function paramFor(mode, value){
  if (mode === 'custom'){
    const p = String(value).split('|');
    return 'start=' + encodeURIComponent(p[0]) + '&end=' + encodeURIComponent(p[1]);
  }
  return mode === 'range' ? 'rangeMonths=' + value : 'months=' + value;
}

async function load(mode, value){
  markPeriod(mode, value);
  const key = mode + ':' + value;
  const mine = ++seq;

  if (cache.has(key)){
    state.payload = normalize(cache.get(key));
    setStatus(state.payload.connected ? 'Live' : 'Not connected', state.payload.connected ? 'live' : 'bad');
    renderAll();
    return;
  }

  setStatus('Loading');
  try {
    const sep = LIVE_DATA_URL.indexOf('?') === -1 ? '?' : '&';
    const url = LIVE_DATA_URL + sep + paramFor(mode, value) + (ACCESS_KEY ? '&key=' + encodeURIComponent(ACCESS_KEY) : '');
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || data.ok === false) throw new Error((data && data.error) || 'Bad response');
    if (mine !== seq) return;
    cache.set(key, data);
    state.payload = normalize(data);
    setStatus(state.payload.connected ? 'Live' : 'Not connected', state.payload.connected ? 'live' : 'bad');
    renderAll();
  } catch (err){
    if (mine !== seq) return;
    console.warn('Feed unavailable:', err);
    setStatus('Not connected', 'bad');
    showFeedError('The data feed did not respond.');
  }
}

document.querySelectorAll('#periods button').forEach(b => {
  if (!b.dataset.mode || b.dataset.mode === 'custom') return;
  b.addEventListener('click', () => {
    document.getElementById('daterange').classList.remove('open');
    load(b.dataset.mode, Number(b.dataset.value));
  });
});

/* =========================================================
   DATE RANGE
========================================================= */
const from = document.getElementById('from');
const to = document.getElementById('to');

function todayThere(){
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: REPORTING_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
}
function applyRange(){
  const err = document.getElementById('rangeErr');
  if (!from.value || !to.value){ err.textContent = 'Choose both dates.'; return; }
  if (from.value > to.value){ err.textContent = 'The start date is after the end date.'; return; }
  err.textContent = '';
  load('custom', from.value + '|' + to.value);
}
document.getElementById('customBtn').addEventListener('click', () => {
  document.getElementById('daterange').classList.toggle('open');
});
document.getElementById('apply').addEventListener('click', applyRange);
[from, to].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') applyRange(); }));

(function seed(){
  const t = todayThere();
  from.max = t; to.max = t;
  from.value = t.slice(0, 8) + '01';
  to.value = t;
})();

/* Initial period: honours ?start=&end=, ?rangeMonths=, or ?months= on
   the URL even in a locked embed (so an embed can be pinned to, say,
   "this month" instead of the default last month), falling back to
   DEFAULT_PERIOD when none of those are present. */
(function initialLoad(){
  const start = urlParams.get('start'), end = urlParams.get('end');
  if (start && end) { load('custom', start + '|' + end); return; }
  const rangeMonths = urlParams.get('rangeMonths');
  if (rangeMonths) { load('range', Number(rangeMonths)); return; }
  const months = urlParams.get('months');
  if (months !== null) { load('month', Number(months)); return; }
  load(DEFAULT_PERIOD.mode, DEFAULT_PERIOD.value);
})();
</script>
